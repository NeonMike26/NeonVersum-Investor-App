<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mission Control | NeonVersum</title>

<link rel="stylesheet" href="../css/app.css?v=40">
<link rel="stylesheet" href="../css/mission-control.css?v=27">
    
</head>

<body>

<main class="mission-control">

    <div class="space-background"></div>

    <section class="mission-stage">

    <div class="orbit orbit-primary" aria-label="Mission Control Navigation">

        <a class="orbit-item orbit-item-1" href="dashboard.html">
            <span class="orbit-dot"></span>
            <span class="orbit-label">Dashboard</span>
        </a>

        <a class="orbit-item orbit-item-2" href="#">
            <span class="orbit-dot"></span>
            <span class="orbit-label">Investments</span>
        </a>

        <a class="orbit-item orbit-item-3" href="#">
            <span class="orbit-dot"></span>
            <span class="orbit-label">Dokumente</span>
        </a>

        <a class="orbit-item orbit-item-4" href="#">
            <span class="orbit-dot"></span>
            <span class="orbit-label">Updates</span>
        </a>

    </div>

    <section class="planet-center">

    <div class="energy-pulse"></div>

    <img
        src="../images/PNG LOGO.png"
        alt="NeonVersum"
        class="planet-logo">

    <button
    id="logout-button"
    type="button"
    style="
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 9999;
        padding: 12px 20px;
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 999px;
        background: rgba(5,5,15,0.85);
        color: white;
        font-size: 14px;
        cursor: pointer;
    "
>
    Abmelden
</button>
        
</section>

</section>

</main>

<script src="../js/app.js?v=22"></script>
<script src="../js/mission-control.js?v=22"></script>

<script>
if (sessionStorage.getItem("nvLoggedIn") !== "true") {
    window.location.replace("login.html");
}

const logoutButton = document.getElementById("logout-button");

if (logoutButton) {
    logoutButton.addEventListener("click", () => {
        sessionStorage.removeItem("nvLoggedIn");
        window.location.replace("login.html");
    });
}
</script>
    
</body>

</html>
