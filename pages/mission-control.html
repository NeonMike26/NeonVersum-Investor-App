<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<script>
const isLoggedIn =
    sessionStorage.getItem("nvLoggedIn") === "true" ||
    localStorage.getItem("nvLoggedIn") === "true";

if (!isLoggedIn) {
    window.location.replace("login.html");
}
</script>
    
<title>Mission Control | NeonVersum</title>

<link rel="stylesheet" href="../css/app.css?v=40">
<link rel="stylesheet" href="../css/mission-control.css?v=27">
    
</head>

<body>

<button
    id="logout-button"
    type="button"
    style="
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 2147483647;
        padding: 12px 22px;
        background: rgba(10,10,20,0.95);
        color: #ffffff;
        border: 1px solid rgba(255,255,255,0.30);
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        pointer-events: auto;
        isolation: isolate;
    "
>
    Abmelden
</button>
    
<main class="mission-control">

    <div class="space-background"></div>

    <section class="mission-stage">

    <div class="orbit orbit-primary" aria-label="Mission Control Navigation">

        <a class="orbit-item orbit-item-1" href="dashboard.html">
            <span class="orbit-dot"></span>
            <span class="orbit-label">Dashboard</span>
        </a>

        <a class="orbit-item orbit-item-2" href="investments.html">
            <span class="orbit-dot"></span>
            <span class="orbit-label">Investments</span>
        </a>

        <a class="orbit-item orbit-item-3" href="documents.html">
            <span class="orbit-dot"></span>
            <span class="orbit-label">Dokumente</span>
        </a>

        <a class="orbit-item orbit-item-4" href="buy-tokens.html">
    <span class="orbit-dot"></span>
    <span class="orbit-label">Token kaufen</span>
</a>

<a
    id="masters-satellite"
    class="orbit-item orbit-item-5"
    href="masters.html"
    hidden
>
    <span class="orbit-dot"></span>
    <span class="orbit-label">Masters</span>
</a>
        
    </div>

    <section class="planet-center">

    <div class="energy-pulse"></div>

    <div class="planet-center-content">

    <img
        src="../images/PNG LOGO.png"
        alt="NeonVersum"
        class="planet-logo">

    <div
    id="welcome-message"
    style="
        margin-top:24px;
        text-align:center;
        color:white;
        line-height:1.5;
    "
>
    Willkommen zurück
</div>

</div>

    
        
</section>

</section>

</main>

<script src="../js/app.js?v=22"></script>
<script src="../js/mission-control.js?v=23"></script>

<script>
const logoutButton =
    document.getElementById("logout-button");

if (logoutButton) {
    logoutButton.addEventListener("click", () => {
        sessionStorage.clear();
        localStorage.clear();

        window.location.replace("login.html");
    });
}

const mastersSatellite =
    document.getElementById("masters-satellite");

const mastersAccess =
    sessionStorage.getItem("nvMastersAccess") ||
    localStorage.getItem("nvMastersAccess");

if (
    mastersSatellite &&
    mastersAccess === "true"
) {
    mastersSatellite.hidden = false;
}
    
const welcomeMessage =
    document.getElementById("welcome-message");

const storedName =
    sessionStorage.getItem("nvUserName") ||
    localStorage.getItem("nvUserName");

if (welcomeMessage) {
    welcomeMessage.textContent =
        storedName
            ? `Herzlich willkommen zurück, ${storedName}.`
            : "Herzlich willkommen zurück.";
}

loadInvestorData();
</script>
    
</body>

</html>
