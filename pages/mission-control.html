<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<script>
const isLoggedIn =
    sessionStorage.getItem("nvLoggedIn") === "true" ||
    localStorage.getItem("nvLoggedIn") === "true";

if (!isLoggedIn) {
    window.location.replace("login.html");
}
</script>
    
<title>Mission Control | NeonVersum</title>

<link rel="stylesheet" href="../css/app.css?v=40">
<link rel="stylesheet" href="../css/mission-control.css?v=27">
    
</head>

<body>

<button
    id="logout-button"
    type="button"
    style="
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 2147483647;
        padding: 12px 22px;
        background: rgba(10,10,20,0.95);
        color: #ffffff;
        border: 1px solid rgba(255,255,255,0.30);
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        pointer-events: auto;
        isolation: isolate;
    "
>
    Abmelden
</button>
    
<main class="mission-control">

    <div class="space-background"></div>

    <section class="mission-stage">

    <div class="orbit orbit-primary" aria-label="Mission Control Navigation">

        <a class="orbit-item orbit-item-1" href="dashboard.html">
            <span class="orbit-dot"></span>
            <span class="orbit-label">Dashboard</span>
        </a>

        <a class="orbit-item orbit-item-2" href="investments.html">
            <span class="orbit-dot"></span>
            <span class="orbit-label">Investments</span>
        </a>

        <a class="orbit-item orbit-item-3" href="documents.html">
            <span class="orbit-dot"></span>
            <span class="orbit-label">Dokumente</span>
        </a>

        <a class="orbit-item orbit-item-4" href="#">
            <span class="orbit-dot"></span>
            <span class="orbit-label">Updates</span>
        </a>

    </div>

    <section class="planet-center">

    <div class="energy-pulse"></div>

    <div class="planet-center-content">

    <img
        src="../images/PNG LOGO.png"
        alt="NeonVersum"
        class="planet-logo">

    <div
        id="investor-info"
        style="
            margin-top:24px;
            text-align:center;
            color:white;
            line-height:1.8;
        "
    >
        <div>Lade Investor-Daten...</div>
    </div>

</div>

    
        
</section>

</section>

</main>

<script src="../js/app.js?v=22"></script>
<script src="../js/mission-control.js?v=23"></script>

<script>
const logoutButton =
    document.getElementById("logout-button");

if (logoutButton) {
    logoutButton.addEventListener("click", () => {
        sessionStorage.clear();
        localStorage.clear();

        window.location.replace("login.html");
    });
}

async function loadInvestorData() {

    const email =
        sessionStorage.getItem("nvEmail") ||
        localStorage.getItem("nvEmail");

    if (!email) {
        return;
    }

    const info =
        document.getElementById("investor-info");

    try {

        const response = await fetch(
            "https://neonversum-api.m-fehringer.workers.dev/investor",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email
                })
            }
        );

        const result =
            await response.json();

        if (!result.success) {
            info.innerHTML =
                "Investor konnte nicht geladen werden.";
            return;
        }

        const investor =
            result.investor;

        info.innerHTML = `
            <strong>${investor.name}</strong><br><br>

            Investor-ID<br>
            ${investor.x_studio_investor_id}<br><br>

            Status<br>
            ${investor.x_studio_investor_status}<br><br>

            Token<br>
            ${investor.x_studio_token_bestand}<br><br>

            Investiert<br>
            ${investor.x_studio_investierter_betrag}<br><br>

            Referral<br>
            ${investor.x_studio_referral_code}
        `;

    } catch (error) {

        info.innerHTML =
            "Fehler beim Laden der Investor-Daten.";

    }

}

loadInvestorData();
</script>
    
</body>

</html>
