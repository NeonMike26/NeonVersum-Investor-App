<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard | NeonVersum</title>

    <link rel="stylesheet" href="../css/app.css?v=20">
    <link rel="stylesheet" href="../css/mission-control.css?v=22">
    <link rel="stylesheet" href="../css/dashboard.css?v=22">

</head>

<body>

<main class="dashboard">

    <header class="dashboard-header">

        <img
            src="../images/PNG LOGO.png"
            alt="NeonVersum"
            class="dashboard-logo">

        <h1>MISSION DASHBOARD</h1>

        <p>
            Willkommen zurück Investor.
        </p>

    </header>
    <section class="dashboard-grid">

    <article class="dashboard-card dashboard-card-purple">
        <div class="portfolio-left">

    <div class="portfolio-title">
        PORTFOLIO
    </div>

    <div class="portfolio-value">
        12.450 €
    </div>

    <div class="portfolio-label">
        Gesamtinvestment
    </div>

</div>

<div class="portfolio-right">

    <div class="portfolio-orb">
        <div class="portfolio-wave"></div>
    </div>

</div>
    </article>

    <article class="dashboard-card dashboard-card-green">

    <div class="news-left">

        <div class="news-icon">
            🔔
        </div>

        <div class="news-info">

            <div class="news-title">
                NEWS
            </div>

            <div class="news-time">
                Letztes Update: Heute 08:15 Uhr
            </div>

        </div>

    </div>

    <div class="news-right">

        <div class="news-badge">
            2 NEU
        </div>

        <div class="news-arrow">
            ›
        </div>

    </div>

</article>

<article class="dashboard-card dashboard-card-token">

    <div class="token-title">
        TOKENPREIS
    </div>

    <div class="token-value">
        3,25 €
    </div>

    <div class="token-change">
        +4,8 % heute
    </div>

</article>    

</section>

</main>

<script src="../js/dashboard.js?v=1"></script>

</body>

</html>
