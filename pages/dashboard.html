<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard | NeonVersum</title>

    <link rel="stylesheet" href="../css/app.css?v=20">
    <link rel="stylesheet" href="../css/mission-control.css?v=22">
    <link rel="stylesheet" href="../css/dashboard.css?v=9">

</head>

<body>

<main class="dashboard">

    <header class="dashboard-header">

        <img
            src="../images/PNG LOGO.png"
            alt="NeonVersum"
            class="dashboard-logo">

        <h1>MISSION DASHBOARD</h1>

        <p>
            Willkommen zurück Investor.
        </p>

    </header>
    <section class="dashboard-grid">

    <article class="dashboard-card dashboard-card-purple">
        <h2>Portfolio</h2>
        <p>Dein Investment auf einen Blick.</p>
    </article>

    <article class="dashboard-card dashboard-card-cyan">
        <h2>Investments</h2>
        <p>Alle Beteiligungen und Holdings.</p>
    </article>

    <article class="dashboard-card dashboard-card-blue">
        <h2>Dokumente</h2>
        <p>Verträge und Downloads.</p>
    </article>

    <article class="dashboard-card dashboard-card-green">
        <h2>News</h2>
        <p>Neuigkeiten aus dem NeonVersum.</p>
    </article>

</section>

</main>

<script src="../js/dashboard.js?v=1"></script>

</body>

</html>
