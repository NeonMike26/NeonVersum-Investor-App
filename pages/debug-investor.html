<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Investor-Felder prüfen</title>
</head>

<body>

    <h1>Odoo-Investorfelder prüfen</h1>

    <input
        id="email"
        type="email"
        value="m.lama@gmx.at"
        placeholder="E-Mail-Adresse"
    >

    <button
        id="check-button"
        type="button"
    >
        Felder prüfen
    </button>

    <pre id="result">
Noch keine Abfrage durchgeführt.
    </pre>

    <script>
    const button =
        document.getElementById("check-button");

    const emailInput =
        document.getElementById("email");

    const resultElement =
        document.getElementById("result");

    button.addEventListener(
        "click",
        async () => {
            resultElement.textContent =
                "Investor-Daten werden geladen...";

            try {
                const response = await fetch(
                    "https://neonversum-api.m-fehringer.workers.dev/debug-investor-fields"
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            email:
                                emailInput.value
                                    .trim()
                                    .toLowerCase()
                        })
                    }
                );

                const result =
                    await response.json();

                resultElement.textContent =
                    JSON.stringify(
                        result,
                        null,
                        2
                    );
            } catch (error) {
                resultElement.textContent =
                    `Fehler: ${error.message}`;
            }
        }
    );
</script>

</body>

</html>
