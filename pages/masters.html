<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<script>
const isLoggedIn =
    sessionStorage.getItem("nvLoggedIn") === "true" ||
    localStorage.getItem("nvLoggedIn") === "true";

const mastersAccess =
    sessionStorage.getItem("nvMastersAccess") ||
    localStorage.getItem("nvMastersAccess");

if (!isLoggedIn) {
    window.location.replace("login.html");
}

if (mastersAccess !== "true") {
    window.location.replace("mission-control.html");
}
</script>

<title>Masters | NeonVersum</title>

<link rel="stylesheet" href="../css/app.css?v=40">

</head>

<body>

<main
    style="
        max-width:900px;
        margin:60px auto;
        padding:30px;
        color:white;
        font-family:Arial,sans-serif;
    "
>

    <a
        href="mission-control.html"
        style="
            display:inline-block;
            margin-bottom:30px;
            color:#9ba6c9;
            text-decoration:none;
        "
    >
        ← Zurück zur Mission Control
    </a>

    <h1
        style="
            margin:0;
            font-size:42px;
        "
    >
        🌍 Masters
    </h1>

    <p
        style="
            margin-top:16px;
            color:#9ba6c9;
            font-size:18px;
            line-height:1.6;
        "
    >
        NeonVersum Executive Control
    </p>

</main>

</body>

</html>
